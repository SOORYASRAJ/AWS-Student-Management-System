<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students - Student Management System</title>

    <link rel="stylesheet"
          href="../static/style.css">
</head>

<body class="students-page">

    <div class="students-container">

        <h1>Student Management System</h1>

        <p class="welcome">Welcome, admin</p>

        <a href="{{ url_for('logout') }}" class="logout">
            Logout
        </a>

        <hr>

        <h2>Add Student</h2>

        <form method="POST" action="{{ url_for('add_student') }}">

            <label for="name">Name</label>
            <input type="text"
                   id="name"
                   name="name"
                   required>

            <label for="email">Email</label>
            <input type="email"
                   id="email"
                   name="email"
                   required>

            <label for="course">Course</label>
            <input type="text"
                   id="course"
                   name="course"
                   required>

            <button type="submit">
                Add Student
            </button>

        </form>

        <hr>

        <h2>Students</h2>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

                {% for student in students %}

                <tr>
                    <td>{{ student[0] }}</td>
                    <td>{{ student[1] }}</td>
                    <td>{{ student[2] }}</td>
                    <td>{{ student[3] }}</td>

                    <td>
                        <a href="{{ url_for('delete_student', id=student[0]) }}">
                            Delete
                        </a>
                    </td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</body>
</html>
